# Builds the web version of Nouri and publishes it to GitHub Pages, along with
# privacy.html (the privacy policy linked from the Play Store listing).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
        env:
          # Repository secret. The key still ends up in the public JavaScript (as it does in
          # the app); keeping it out of the repo just stops it being copied from the source.
          VITE_USDA_API_KEY: ${{ secrets.VITE_USDA_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
